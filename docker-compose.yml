x-frappe-image: &frappe-image
  build:
    context: .
    dockerfile: Containerfile
  image: frappe-crm-custom:v15
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  environment: &frappe-env
    DB_HOST: mariadb
    DB_PORT: "3306"
    REDIS_CACHE: redis-cache:6379
    REDIS_QUEUE: redis-queue:6379
    SOCKETIO_PORT: "9000"

services:
  configurator:
    <<: *frappe-image
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -g db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -g socketio_port $$SOCKETIO_PORT;
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: *frappe-image
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        wait-for-it -t 120 mariadb:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json` ]]; do
          echo "Aguardando configurator..."; sleep 5;
          if (( `date +%s`-start > 120 )); then echo "Timeout"; exit 1; fi;
        done;
        if [ ! -d "sites/${FRAPPE_SITE_NAME}" ]; then
          bench new-site ${FRAPPE_SITE_NAME}
            --mariadb-root-password=${DB_ROOT_PASSWORD}
            --admin-password=${ADMIN_PASSWORD}
            --no-mariadb-socket
            --install-app crm;
        else
          echo "Site ja existe, pulando criacao.";
        fi;
        bench --site ${FRAPPE_SITE_NAME} set-config host_name "https://${FRAPPE_SITE_NAME}";
        bench --site ${FRAPPE_SITE_NAME} set-config default_language "pt-BR";
        bench --site ${FRAPPE_SITE_NAME} migrate;
    environment:
      <<: *frappe-env
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *frappe-image
    command: [/home/frappe/frappe-bench/env/bin/gunicorn, --bind=0.0.0.0:8000, --workers=4, --timeout=120, --graceful-timeout=30, frappe.app:application, --preload]
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: *frappe-image
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started

  websocket:
    <<: *frappe-image
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    <<: *frappe-image
    command: [bench, worker, --queue, short,default]
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    <<: *frappe-image
    command: [bench, worker, --queue, long]
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    <<: *frappe-image
    command: [bench, schedule]
    depends_on:
      create-site:
        condition: service_completed_successfully

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  logs:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
